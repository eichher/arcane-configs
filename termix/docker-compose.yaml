services:
  termix:
    image: ghcr.io/lukegus/termix:latest
    container_name: termix
    restart: unless-stopped
    ports:
      - "8081:8081"
    volumes:
      - termix-data:/app/data
    environment:
      PORT: "8081"
    depends_on:
      - termix-guacd
    networks:
      - termix-net

  termix-guacd:
    image: guacamole/guacd:1.6.0
    container_name: guacd
    restart: unless-stopped
    ports:
      - "4823:4823"
    networks:
      - termix-net

volumes:
  termix-data:
    driver: local

networks:
  termix-net:
    driver: bridge
